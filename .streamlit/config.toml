[server]
maxUploadSize = 200

[client]
# Oculta "Deploy" y el menú de desarrollador: quien usa la app no los necesita.
toolbarMode = "minimal"

# Tema oscuro con la paleta "zinc" de shadcn/ui y su variante roja para la
# acción principal. El CSS de ui_estilos.py usa los mismos valores.
[theme]
base = "dark"
primaryColor = "#DC2626"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#18181B"
textColor = "#FAFAFA"
borderColor = "#27272A"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
linkColor = "#FAFAFA"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Geist, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap, monospace"
codeBackgroundColor = "#18181B"
redColor = "#F87171"
greenColor = "#4ADE80"
yellowColor = "#FBBF24"
blueColor = "#60A5FA"

[theme.sidebar]
backgroundColor = "#0C0C0E"
secondaryBackgroundColor = "#18181B"
borderColor = "#27272A"
