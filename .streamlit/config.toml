[server]
maxUploadSize = 200

[client]
# Oculta "Deploy" y el menú de desarrollador: quien usa la app no los necesita.
toolbarMode = "minimal"

# Tema oscuro con tres colores: Midnight Black (fondo), Electric Blue
# (selección, pasos y detalles) y Cantaloupe Orange (la acción principal).
# El CSS de ui_estilos.py usa los mismos valores.
[theme]
base = "dark"
primaryColor = "#FC734D"
backgroundColor = "#02070A"
secondaryBackgroundColor = "#07131B"
textColor = "#F2F5F7"
borderColor = "#1C2A33"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "full"
linkColor = "#6CC6F2"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap, serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
codeBackgroundColor = "#050E14"
# FALLA en rojo y AVISO en el naranja de la marca (Validar CSF): se
# distinguen también por claridad, no solo por tono.
redColor = "#FF4D5E"
orangeColor = "#FC734D"
greenColor = "#34C38F"
yellowColor = "#F5B54A"
blueColor = "#0297DE"

[theme.sidebar]
backgroundColor = "#050E14"
secondaryBackgroundColor = "#07131B"
borderColor = "#14212A"
