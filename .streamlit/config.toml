[server]
maxUploadSize = 200

# El tema se fija en claro a propósito: el CSS de ui_estilos.py está
# calibrado para fondo claro, y dejarlo seguir el modo oscuro del sistema
# haría que el texto quedara ilegible.
[theme]
base = "light"
primaryColor = "#C8102E"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#132038"
font = "sans serif"
